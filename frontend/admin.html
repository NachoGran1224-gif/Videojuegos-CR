<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Videojuegos CR</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <h1>Videojuegos CR</h1>
        <nav>
            <a href="index.html">Catálogo de juegos</a>
            <a href="admin.html">Administración</a>
            <span id="contador-carrito" class="badge-carrito">Carrito (0)</span>
        </nav>
    </header>

    <main>
        <div class="barra-superior">
            <h2>Panel de Administración de Productos</h2>
        </div>

        <section class="panel-formulario">
            <h3 id="titulo-formulario">Agregar juego</h3>
            <form id="form-producto" onsubmit="guardarProductoAdmin(event)">
                <input type="hidden" id="producto-id" value="">

                <div class="fila-form">
                    <input type="text" id="nombre" placeholder="Nombre" required>
                    <select id="categoria" required>
                        <option value="">Selecciona categoría...</option>
                        <option value="1">Acción</option>
                        <option value="2">Aventura</option>
                        <option value="3">RPG</option>
                        <option value="4">Deportes</option>
                        <option value="5">Estrategia</option>
                    </select>
                </div>

                <div class="fila-form">
                    <input type="number" id="precio" placeholder="Precio (₡)" min="1" step="any" required>
                    <input type="number" id="stock" placeholder="Cantidad de unidades" min="0" required>
                    <input type="text" id="imagen" placeholder="imagen (ej. sekiro.jpg)" required>
                </div>

                <textarea id="descripcion" rows="2" placeholder="Descripción corta del videojuego..." required></textarea>

                <div class="fila-form">
                    <button type="submit" id="btn-guardar">Guardar Videojuego</button>
                    <button type="button" id="btn-cancelar" onclick="cancelarEdicion()" style="display:none; background-color:#64748b;">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <section class="panel-tabla">
            <h3>Juegos Actuales</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Videojuegos CR - Luis Ignacio Granados Mena - Universidad Castro Carazo</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
